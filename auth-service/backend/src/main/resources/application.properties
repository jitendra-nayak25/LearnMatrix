spring.application.name=auth-service

# Server
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/oblms_auth
spring.datasource.username=root
spring.datasource.password=Lucky@75
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Gmail SMTP for OTP (use a Gmail App Password, not your normal password)
# Fill these with your Gmail + 16-char App Password, or set env vars.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true