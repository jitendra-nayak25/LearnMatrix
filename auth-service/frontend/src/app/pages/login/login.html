<div class="container">
    <div class="card">
        <h1>LearnMatrix</h1>
        <h2>Login</h2>

        <!-- Choose login method -->
        <div class="roles">
            <button type="button" [class.active]="mode === 'password'" (click)="setMode('password')">Password</button>
            <button type="button" [class.active]="mode === 'otp'" (click)="setMode('otp')">OTP</button>
        </div>

        <label>Email</label>
        <input [(ngModel)]="email" placeholder="Enter email" />

        @if (mode === 'password') {
        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Enter password" />
        <button (click)="login()" [disabled]="busy">{{ busy ? 'Please wait...' : 'Login' }}</button>
        }

        @if (mode === 'otp') {
        @if (!otpSent) {
        <button (click)="sendOtp()" [disabled]="busy">{{ busy ? 'Sending...' : 'Send OTP' }}</button>
        } @else {
        <label>OTP (sent to email)</label>
        <input [(ngModel)]="otp" placeholder="Enter OTP" />
        <button (click)="login()" [disabled]="busy">{{ busy ? 'Please wait...' : 'Verify & Login' }}</button>
        }
        }

        @if (errorMessage) { <p class="error">{{ errorMessage }}</p> }

        <p>Don't have an account? <a routerLink="/register">Register</a></p>
    </div>
</div>
