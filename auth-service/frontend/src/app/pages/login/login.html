<div class="container">
    <div class="card">
        <h1>LearnMatrix</h1>
        <h2>Login</h2>

        <div class="roles">
            <button type="button" [class.active]="mode === 'password'" (click)="setMode('password')">Password</button>
            <button type="button" [class.active]="mode === 'otp'" (click)="setMode('otp')">OTP</button>
        </div>

        <label>Email</label>
        <input [(ngModel)]="email" placeholder="Enter email" />

        @if (mode === 'password') {
        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Enter password" />
        <button (click)="login()" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
        }

        @if (mode === 'otp' && !otpSent) {
        <button (click)="sendOtp()" [disabled]="sendingOtp">{{ sendingOtp ? 'Sending...' : 'Send OTP' }}</button>
        }

        @if (mode === 'otp' && otpSent) {
        <label>OTP (sent to {{ email }})</label>
        <input [(ngModel)]="otp" placeholder="Enter OTP" />
        <button (click)="login()" [disabled]="loading">{{ loading ? 'Verifying...' : 'Verify & Login' }}</button>
        <button class="link" (click)="sendOtp()" [disabled]="sendingOtp">Resend OTP</button>
        }

        @if (info) { <p class="success">{{ info }}</p> }
        @if (error) { <p class="error">{{ error }}</p> }

        <p>Don't have an account? <a routerLink="/register">Register</a></p>
    </div>
</div>
