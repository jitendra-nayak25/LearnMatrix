<div class="container">
    <div class="card">
        <h1>LearnMatrix</h1>
        <h2>Register</h2>

        <!-- Step 1: choose role (Student / Faculty only) -->
        <div class="roles">
            <button type="button" [class.active]="role === 'STUDENT'" (click)="role = 'STUDENT'">Student</button>
            <button type="button" [class.active]="role === 'FACULTY'" (click)="role = 'FACULTY'">Faculty</button>
        </div>

        <label>Name</label>
        <input [(ngModel)]="name" placeholder="Enter name" />

        <label>Email</label>
        <input [(ngModel)]="email" placeholder="Enter email" />

        @if (!otpSent) {
        <button (click)="sendOtp()">Send OTP</button>
        }

        @if (otpSent) {
        <label>OTP (sent to email)</label>
        <input [(ngModel)]="otp" placeholder="Enter OTP" />

        <label>Password (you will use this to login)</label>
        <input type="password" [(ngModel)]="password" placeholder="Create password" />

        <button (click)="register()">Verify OTP & Register</button>
        }

        @if (message) { <p class="success">{{ message }}</p> }
        @if (errorMessage) { <p class="error">{{ errorMessage }}</p> }

        <p>Already have an account? <a routerLink="/login">Login</a></p>
    </div>
</div>
